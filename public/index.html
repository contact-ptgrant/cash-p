<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo-container img {
            max-width: 100px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 50%;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-step {
            display: none;
            text-align: left;
        }
        .form-step.active {
            display: block;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .next-btn, .submit-btn {
            background-color: #007bff;
            color: white;
            width: 100%;
            margin-top: 20px;
        }
        .next-btn:hover, .submit-btn:hover {
            background-color: #0056b3;
        }
        .button-group button {
            width: 48%;
        }
        .back-btn {
            background-color: #6c757d;
            color: white;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
        #responseMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- Logo Display Section -->
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" class="portal-logo">
        </div>
        
        <h2>Secure Verification</h2>
        
        <form id="verificationForm">
            <!-- Step 1: Identifier -->
            <div class="form-step active" id="step-1">
                <label for="identifierType">Identifier Type:</label>
                <select id="identifierType" name="identifierType" required>
                    <option value="Email">Email</option>
                    <option value="Username">Username</option>
                    <option value="Phone">Phone</option>
                </select>
                
                <label for="identifierValue">Enter Value:</label>
                <input type="text" id="identifierValue" name="identifierValue" required placeholder="Enter your identifier">
                
                <button type="button" class="next-btn" onclick="nextStep(2)">Next</button>
            </div>

            <!-- Step 2: PIN -->
            <div class="form-step" id="step-2">
                <label for="pinText">Security PIN:</label>
                <input type="password" id="pinText" name="pinText" maxlength="6" placeholder="Enter your PIN">
                
                <div class="button-group">
                    <button type="button" class="back-btn" onclick="nextStep(1)">Back</button>
                    <button type="button" class="next-btn" onclick="nextStep(3)">Next</button>
                </div>
            </div>

            <!-- Step 3: Numeric Entries -->
            <div class="form-step" id="step-3">
                <label for="numericValue">Verification Code:</label>
                <input type="number" id="numericValue" name="numericValue" placeholder="Enter numbers">
                
                <label for="anyNumberValue">Additional Entry:</label>
                <input type="number" id="anyNumberValue" name="anyNumberValue" placeholder="Enter optional digits">
                
                <div class="button-group">
                    <button type="button" class="back-btn" onclick="nextStep(2)">Back</button>
                    <button type="submit" class="submit-btn">Submit</button>
                </div>
            </div>
        </form>
        <div id="responseMessage"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
